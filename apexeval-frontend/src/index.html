<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>ApexEval — Assignment Evaluation Platform</title>
  <meta name="description" content="ApexEval is a professional AI-assisted assignment evaluation platform for students, instructors, and administrators.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=zodiak@800&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=neco@700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root>
    <style>
      body { margin: 0; overflow: hidden; }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #ffffff;
      }
      [data-theme="dark"] .initial-loader { background: #0a0a0a; }

      .boxes {
        --size: 32px;
        --duration: 800ms;
        height: calc(var(--size) * 2);
        width: calc(var(--size) * 3);
        position: relative;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
        margin-top: calc(var(--size) * 1.5 * -1);
        transform: rotateX(60deg) rotateZ(45deg) rotateY(0deg) translateZ(0px);
      }

      .boxes .box {
        width: var(--size);
        height: var(--size);
        top: 0;
        left: 0;
        position: absolute;
        transform-style: preserve-3d;
      }

      .boxes .box:nth-child(1) { transform: translate(100%, 0); animation: box1 var(--duration) linear infinite; }
      .boxes .box:nth-child(2) { transform: translate(0, 100%); animation: box2 var(--duration) linear infinite; }
      .boxes .box:nth-child(3) { transform: translate(100%, 100%); animation: box3 var(--duration) linear infinite; }
      .boxes .box:nth-child(4) { transform: translate(200%, 0); animation: box4 var(--duration) linear infinite; }

      .boxes .box > div {
        --background: #FF6D1F;
        --top: auto;
        --right: auto;
        --bottom: auto;
        --left: auto;
        --translateZ: calc(var(--size) / 2);
        --rotateY: 0deg;
        --rotateX: 0deg;
        position: absolute;
        width: 100%;
        height: 100%;
        background: var(--background);
        top: var(--top);
        right: var(--right);
        bottom: var(--bottom);
        left: var(--left);
        transform: rotateY(var(--rotateY)) rotateX(var(--rotateX)) translateZ(var(--translateZ));
      }

      .boxes .box > div:nth-child(1) { --top: 0; --left: 0; }
      .boxes .box > div:nth-child(2) { --background: #cc5513; --right: 0; --rotateY: 90deg; }
      .boxes .box > div:nth-child(3) { --background: #e55f17; --rotateX: -90deg; }
      .boxes .box > div:nth-child(4) { --background: #F5E7C6; --top: 0; --left: 0; --translateZ: calc(var(--size) * 3 * -1); }
      [data-theme="dark"] .boxes .box > div:nth-child(4) { --background: #262626; }

      @keyframes box1 {
        0%, 50% { transform: translate(100%, 0); }
        100% { transform: translate(200%, 0); }
      }
      @keyframes box2 {
        0% { transform: translate(0, 100%); }
        50% { transform: translate(0, 0); }
        100% { transform: translate(100%, 0); }
      }
      @keyframes box3 {
        0%, 50% { transform: translate(100%, 100%); }
        100% { transform: translate(0, 100%); }
      }
      @keyframes box4 {
        0% { transform: translate(200%, 0); }
        50% { transform: translate(200%, 100%); }
        100% { transform: translate(100%, 100%); }
      }
    </style>
    <div class="initial-loader" id="initial-loader">
      <div class="boxes">
        <div class="box"><div></div><div></div><div></div><div></div></div>
        <div class="box"><div></div><div></div><div></div><div></div></div>
        <div class="box"><div></div><div></div><div></div><div></div></div>
        <div class="box"><div></div><div></div><div></div><div></div></div>
      </div>
    </div>
  </app-root>
  <script>
    // Fallback: remove initial loader after 5 seconds if Angular hasn't bootstrapped
    setTimeout(() => {
      const loader = document.getElementById('initial-loader');
      if (loader) {
        console.warn('Angular bootstrap timeout - removing initial loader');
        loader.remove();
      }
    }, 5000);
  </script>
</body>
</html>
