spring.application.name=apexeval-backend

# Server
server.port=8080

# ---- ApexEval custom config (Track A) ----

# Docker image used for sandboxed execution containers (Step 7)
apexeval.execution.docker-image=apexeval/student-workspace:latest
apexeval.execution.timeout-seconds=30
apexeval.execution.junit-console-jar=/opt/junit/junit-platform-console-standalone.jar

# Absolute path to the fixtures directory on the HOST machine
# (contains hidden-tests/ subfolders per assignment - NOT shipped to students)
apexeval.fixtures.base-path=/Users/archit/projectS/ApexEval/fixtures

# Webhook that receives {workspacePath, assignmentId, overallStatus, timestamp}
# after every /api/run-test call. Defaults to no-op logger if unset.
apexeval.webhook.url=

# Track B (AI/LLM agent service) endpoint - called on FAIL/FLAGGED_FOR_REVIEW
apexeval.agent.base-url=http://localhost:9000
apexeval.agent.analyze-path=/api/agent/analyze
apexeval.agent.connect-timeout-ms=2000
apexeval.agent.read-timeout-ms=5000

# ---- Persistence (PostgreSQL + Flyway + Redis) ----
# By default, no DataSource / Redis is configured - the app runs
# standalone using the in-memory cache. The auto-configurations
# for JDBC / JPA / Flyway / Redis are explicitly excluded in the
# default profile so the app starts without external services.
#
# To switch on the full persistence + cache stack, launch with:
#
#   --spring.profiles.active=db
#
# and a Postgres + Redis available at the URLs in application-db.properties
# (override via env vars: SPRING_DATASOURCE_URL, SPRING_DATA_REDIS_HOST,
# etc.). The db profile RE-ENABLES the auto-configurations below by
# clearing this exclude list.
#
# Why this dance: the existing dev workflow has no Postgres / Redis,
# and we don't want every developer to spin those up just to run the
# backend. The db profile is the production path.

spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# ---- Cache backend selection ----
#   in-memory (default - works with no external services)
#   redis      (requires the db profile to be active so Redis is wired up)
#   jdbc       (Postgres-backed; durable across Redis outages)
apexeval.cache.backend=in-memory

# ---- Logging ----
logging.level.com.apexeval=DEBUG
