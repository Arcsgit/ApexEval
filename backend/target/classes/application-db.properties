# ---- DB profile: enabled with --spring.profiles.active=db ----
# Loading this profile (on top of application.properties) does three
# things: it re-enables the auto-configurations that were excluded by
# default, sets the DataSource / JPA / Flyway / Redis connection
# details, and flips the default cache backend to redis.

# Re-enable the auto-configurations we excluded in application.properties.
# Spring Boot merges this list with the default; an empty list here
# clears the excludes.
spring.autoconfigure.exclude=

# Postgres.
spring.datasource.url=jdbc:postgresql://localhost:5432/apexeval
spring.datasource.username=apexeval
spring.datasource.password=apexeval
# Hikari sized for the 1000-concurrent target. See SCALING_PLAN.md.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=2000

# JPA. validate is paired with Flyway-managed schema: the JPA entity
# classes must match the columns, but DDL is the migration's job.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway. baseline-on-migrate so adding the migration to a non-empty
# database (e.g. one with leftover tables) doesn't fail.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis (Lettuce client is the Spring Boot default).
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=200ms

# Default the cache backend to redis on the db profile. Still
# overridable by apexeval.cache.backend=... in the env.
apexeval.cache.backend=redis
